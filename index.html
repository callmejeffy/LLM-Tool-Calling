<!DOCTYPE html>
<html>
<head>
    <title>Flight Bot</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #f4f4f9; }
        #chatbox { width: 400px; height: 500px; border: 1px solid #ccc; background: white; padding: 10px; overflow-y: scroll; margin-top: 20px; border-radius: 10px; }
        .user { color: blue; text-align: right; margin: 5px; }
        .bot { color: green; text-align: left; margin: 5px; }
        #input-area { margin-top: 10px; }
    </style>
</head>
<body>
    <h2>✈️ Flight Price Assistant</h2>
    <div id="chatbox"></div>
    <div id="input-area">
        <input type="text" id="userInput" placeholder="Ask about a city...">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const chatbox = document.getElementById('chatbox');
            if(!input.value) return;

            // 1. Show user message
            chatbox.innerHTML += `<p class="user"><b>You:</b> ${input.value}</p>`;
            
            // 2. Call our Python API
            const response = await fetch('http://localhost:8000/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({message: input.value})
            });
            const data = await response.json();

            // 3. Show bot response
            chatbox.innerHTML += `<p class="bot"><b>Bot:</b> ${data.reply}</p>`;
            input.value = '';
            chatbox.scrollTop = chatbox.scrollHeight;
        }
    </script>
</body>
</html>
